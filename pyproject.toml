[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velaplast-core"
version = "0.1.0"
description = "Biblioteca Velaplast: SAP B1, LiveMES, Spotter, fórmulas financeiras canônicas, AI multi-provider, infra comum."
requires-python = ">=3.11"
authors = [{ name = "Velaplast" }]
license = { text = "Proprietary" }

dependencies = [
    # HTTP
    "httpx>=0.27",
    "requests>=2.31",
    # Data
    "pandas>=2.2",
    # DB
    "psycopg2-binary>=2.9",
    # Auth
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    # API framework (pro futuro REST hub da fase 2)
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.27",
    # AI providers
    "anthropic>=0.25",
    "openai>=1.14",
    "google-genai>=0.3",
    "groq>=0.5",
    # Timezone
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["velaplast_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
